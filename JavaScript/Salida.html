<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Instrucciones de salida</title>
    </head>
    <body>
        <h1>Inicio</h1>
        <p>Ejemplo</p>
        <p id="ejemplo_inner">Otro texto de ejemplo</p>
        <script>
            //Alertas y output de ejemplo
            window.alert();
            document.write("Texto de ejemplo");
            document.getElementById("ejemplo_inner").innerHTML="Otro texto mas de ejemplo";
            console.log("Texto de ejemplo de consola");

            //Operaciones matematicas
            alert(2+8);
            document.write(5/7);
            console.log(1+1);
        </script>
    </body>
</html>
