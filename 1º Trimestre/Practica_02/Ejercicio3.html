<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>
    <script>
        let operacion1 = (10 == 10);
        let operacion2 = (10 === 10);
        let operacion3 = (10 === 10.0);
        let operacion4 = ("Laura" == "laura");
        let operacion5 = ("Laura" > "laura");
        let operacion6 = ("Laura" < "laura");
        let operacion7 = ("123" == 123);
        let operacion8 = ("123" === 123);
        let operacion9 = (parseInt("123") === 123);


        alert("El resultado de la operacion 10 == 10 es " + operacion1);
        alert("El resultado de la operacion 10 === 10 es " + operacion2);
        alert("El resultado de la operacion 10 === 10.0 es " + operacion3);
        alert("El resultado de la operacion 'Laura' == 'laura' es " + operacion4);
        alert("El resultado de la operacion 'Laura' > 'laura' es " + operacion5);
        alert("El resultado de la operacion 'Laura' < 'laura' es " + operacion6);
        alert("El resultado de la operacion '123' == 123 es " + operacion7);
        alert("El resultado de la operacion '123' === 123 es " + operacion8);
        alert("El resultado de la operacion parseInt('123') === 123 es " + operacion9);
    </script>
</head>
