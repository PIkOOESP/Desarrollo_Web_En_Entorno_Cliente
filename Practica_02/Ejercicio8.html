<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8</title>
    <script>
        function norm(s){
            return s
            .toLowerCase()
            .trim()
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        let nombre = "adolfo";
        let apellido = "suarez";
        let mensaje = "¿Cuál fue el primer presidente de la democracia española?";
        let error = "";

        do{
            var presi = prompt(error + mensaje);

            alert(norm(presi));
            if(norm(presi) == nombre){
                error = "Te falta el apellido. ";
            } else if(norm(presi) == apellido){
                error = "Te falta el nombre y el segundo apellido. ";
            } else{
                error = "ERROR. Inténtelo de nuevo. ";
            }
        }while(norm(presi) != (nombre + " " + apellido))
    </script>
</head>

</body>
</html>
