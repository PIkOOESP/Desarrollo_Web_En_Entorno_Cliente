<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9</title>
    <script>
        let respuesta = window.prompt("Introduce tu edad");
        if(isNaN(respuesta)){
            alert("NaN")
        } else {
            switch(true){       
                case (respuesta <= 12):
                    alert("Niño");
                    break;

                case (respuesta <= 26):
                    alert("Joven");
                    break;
                
                case (respuesta <= 60):
                    alert("Adulto");
                    break;
                
                case (respuesta > 60):
                    alert("Jubilado");
                    break;
                
                default:
                    alert("Respuesta invalida");
                    break;
            }
        }
    </script>
</head>

</body>
</html>
